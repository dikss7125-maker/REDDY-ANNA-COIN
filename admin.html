<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REDDY COIN • Admin</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#080b12;color:#fff}.w{width:min(980px,100%);margin:auto;padding:22px 16px}.brand{text-align:center;font-size:30px;font-weight:900;letter-spacing:4px;margin:10px 0 24px}.box{background:#111724;border:1px solid #ffffff12;border-radius:24px;padding:24px}.panel{display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stat{padding:16px;border-radius:18px;background:#0c131e;border:1px solid #ffffff0b}.stat b{display:block;font-size:24px;margin-top:5px}label{font-size:13px;color:#a6b4c4;display:block;margin:12px 0 7px}input{width:100%;padding:14px;border-radius:13px;border:1px solid #304153;background:#0a1019;color:#fff;font-size:15px}button{border:0;border-radius:13px;padding:14px;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;font-weight:800;font-size:15px;width:100%;margin-top:16px}.section{border-top:1px solid #ffffff0d;margin-top:20px;padding-top:20px}.muted{color:#8fa2b7}.msg{min-height:22px;margin-top:12px;color:#ffaaaa}.table{overflow:auto;margin-top:12px}table{width:100%;border-collapse:collapse;min-width:620px}th,td{padding:12px;text-align:left;border-bottom:1px solid #ffffff0c;font-size:14px}th{color:#a6b4c4}.pill{background:#143021;color:#91f1bc;border-radius:99px;padding:5px 9px}@media(max-width:650px){.row,.stats{grid-template-columns:1fr}.brand{font-size:24px}}</style></head><body><main class="w"><div class="brand">REDDY COIN ADMIN ⚙️</div><section id="login" class="box"><h2>Admin Login</h2><p class="muted">Enter the admin password.</p><input id="pass" type="password" placeholder="Admin password"><button onclick="login()">LOGIN</button><div id="lm" class="msg"></div></section><section id="panel" class="box panel"><h2>Control Center 🎛️</h2><p class="muted">Manage bonus codes, support and site link.</p><div class="stats"><div class="stat">Members<b id="uc">0</b></div><div class="stat">Bonus Codes<b id="bc">0</b></div><div class="stat">Claims<b id="cc">0</b></div></div><div class="section"><h2>➕ Add Bonus Code</h2><div class="row"><div><label>Bonus code</label><input id="bcode" placeholder="REDDY1000"></div><div><label>Coin value</label><input id="amount" type="number" min="1" placeholder="1000"></div></div><button onclick="add()">ADD BONUS CODE</button><div id="bm" class="msg"></div></div><div class="section"><h2>📞 Support & 🔗 Site Link</h2><div class="row"><div><label>Customer support number</label><input id="support" placeholder="+91 ..."></div><div><label>Site link</label><input id="link" placeholder="https://..."></div></div><label>Welcome text</label><input id="welcome" placeholder="Welcome to REDDY COIN"><button onclick="settings()">SAVE SETTINGS</button><div id="sm" class="msg"></div></div><div class="section"><h2>🎁 Bonus Codes</h2><div class="table"><table><thead><tr><th>Code</th><th>Coins</th><th>Status</th><th>Claimed By</th></tr></thead><tbody id="bt"></tbody></table></div></div><div class="section"><h2>👥 Members</h2><div class="table"><table><thead><tr><th>ID</th><th>Coins</th><th>Registered</th></tr></thead><tbody id="ut"></tbody></table></div></div></section></main><script>let t="";const H=()=>({"Content-Type":"application/json","x-admin-token":t});async function login(){let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pass.value})}),d=await r.json();if(!r.ok)return lm.textContent=d.error;t=d.token;login.style.display="none";panel.style.display="block";load()}async function load(){let r=await fetch("/api/admin/data",{headers:{"x-admin-token":t}}),d=await r.json();uc.textContent=d.users.length;bc.textContent=d.bonuses.length;cc.textContent=d.claims.length;support.value=d.settings.supportNumber||"";link.value=d.settings.siteLink||"";welcome.value=d.settings.welcomeText||"";bt.innerHTML=d.bonuses.map(b=>`<tr><td><b>${e(b.code)}</b></td><td>${b.amount} 🪙</td><td>${b.claimed?'<span class="pill">CLAIMED</span>':'Available'}</td><td>${e(b.claimedBy||"—")}</td></tr>`).join("")||"<tr><td colspan=4>No bonus codes yet.</td></tr>";ut.innerHTML=d.users.map(u=>`<tr><td>${e(u.id)}</td><td>${u.coins} 🪙</td><td>${new Date(u.createdAt).toLocaleString()}</td></tr>`).join("")||"<tr><td colspan=3>No members yet.</td></tr>"}async function add(){let r=await fetch("/api/admin/bonus",{method:"POST",headers:H(),body:JSON.stringify({code:bcode.value,amount:amount.value})}),d=await r.json();bm.textContent=r.ok?"Bonus added successfully.":d.error;if(r.ok){bcode.value="";amount.value="";load()}}async function settings(){let r=await fetch("/api/admin/settings",{method:"POST",headers:H(),body:JSON.stringify({supportNumber:support.value,siteLink:link.value,welcomeText:welcome.value})}),d=await r.json();sm.textContent=r.ok?"Settings saved.":d.error}function e(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}</script></body></html>
