<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REDDY COIN Admin</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef1f4;font-family:Arial;color:#17202a}.wrap{max-width:950px;margin:auto;padding:20px}.brand{text-align:center;font-size:29px;font-weight:900;letter-spacing:2px;margin:10px}.logo{width:66px;height:66px;object-fit:cover;border-radius:18px;margin:auto;display:block;background:#202b36}.card{background:#fff;padding:20px;border-radius:17px;margin:15px 0;box-shadow:0 4px 16px #0001}input,button{width:100%;padding:13px;margin:6px 0;border-radius:10px}button{border:0;background:#202b36;color:#fff;font-weight:700}.hidden{display:none}.preview{max-width:100%;max-height:220px;border-radius:12px}table{width:100%;border-collapse:collapse;overflow:auto}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;font-size:14px}.ok{color:#167a38}.err{color:#c62828}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><div class="brand"><img id="adminLogo" class="logo" style="display:none">REDDY COIN ADMIN</div>
<div id="loginBox" class="card"><h2>Admin Login</h2><input id="password" type="password" placeholder="Admin password"><button onclick="doAdminLogin()">LOGIN</button><p id="loginMsg"></p></div>
<div id="panel" class="hidden">
<div class="card"><h2>Branding</h2><input id="siteName" placeholder="Site name"><input id="logoFile" type="file" accept="image/*"><button onclick="saveBrand()">SAVE SITE NAME / LOGO</button><img id="logoPreview" class="preview"></div>
<div class="card"><h2>Offer</h2><input id="offerFile" type="file" accept="image/*"><button onclick="saveOffer()">UPLOAD NEW OFFER</button><img id="offerPreview" class="preview"></div>
<div class="card"><h2>Customer Care Links</h2><input id="whatsapp" placeholder="WhatsApp link"><input id="telegram" placeholder="Telegram link"><input id="website" placeholder="Website link"><button onclick="saveLinks()">SAVE CUSTOMER CARE</button></div>
<div class="card"><h2>Create New Bonus Code</h2><div class="row"><input id="newCode" placeholder="Bonus Code"><input id="newValue" type="number" min="1" placeholder="Coin Value"></div><button onclick="createCode()">CREATE CODE</button><p id="codeMsg"></p></div>
<div class="card"><h2>Bonus Codes</h2><div id="codes"></div></div>
<div class="card"><h2>Claim History</h2><div id="claims"></div></div><button onclick="logout()">LOG OUT</button>
</div></div>
<script>
async function api(url,opt={}){let r=await fetch(url,opt);let x=await r.json().catch(()=>({}));if(!r.ok)throw new Error(x.error||'Request failed');return x}
async function doAdminLogin(){try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password.value})});document.getElementById('loginBox').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');load()}catch(e){loginMsg.textContent=e.message}}
async function load(){let x=await api('/api/admin/data');siteName.value=x.settings.siteName;whatsapp.value=x.settings.whatsapp;telegram.value=x.settings.telegram;website.value=x.settings.website;if(x.settings.logo)logoPreview.src=x.settings.logo;if(x.settings.offer)offerPreview.src=x.settings.offer;render(x)}
async function saveBrand(){let fd=new FormData();fd.append('siteName',siteName.value);if(logoFile.files[0])fd.append('image',logoFile.files[0]);if(logoFile.files[0])await api('/api/admin/logo',{method:'POST',body:fd});else await api('/api/admin/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({siteName:siteName.value})});load()}
async function saveOffer(){let fd=new FormData();if(!offerFile.files[0])return;fd.append('image',offerFile.files[0]);await api('/api/admin/offer',{method:'POST',body:fd});load()}
async function saveLinks(){await api('/api/admin/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({whatsapp:whatsapp.value,telegram:telegram.value,website:website.value})});load()}
async function createCode(){try{await api('/api/admin/code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:newCode.value,value:Number(newValue.value)})});codeMsg.className='ok';codeMsg.textContent='Code created.';newCode.value='';newValue.value='';load()}catch(e){codeMsg.className='err';codeMsg.textContent=e.message}}
function render(x){codes.innerHTML=x.codes.length?'<table><tr><th>Code</th><th>Coins</th><th>Status</th><th>Player</th></tr>'+x.codes.map(c=>`<tr><td>${c.code}</td><td>${c.value.toLocaleString()}</td><td>${c.used?'USED':'ACTIVE'}</td><td>${c.claimed_by||'-'}</td></tr>`).join('')+'</table>':'No codes';claims.innerHTML=x.claims.length?'<table><tr><th>Player</th><th>Code</th><th>Coins</th><th>Time</th></tr>'+x.claims.map(c=>`<tr><td>${c.player}</td><td>${c.code}</td><td>${c.value.toLocaleString()}</td><td>${c.time}</td></tr>`).join('')+'</table>':'No claims'}
async function logout(){await api('/api/admin/logout',{method:'POST'});location.reload()}
</script></body></html>
