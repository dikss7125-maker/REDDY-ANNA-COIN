<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAHADEV BOOK - Admin</title><link rel="stylesheet" href="/styles.css"></head><body><main class="wrap"><div class="top card" style="position:static"><div class="brand">♛ MAHADEV BOOK ADMIN ♛</div><button class="btn ghost" onclick="location.href='/'">Site</button></div><div class="grid3" style="margin-top:14px"><div class="stat"><div class="muted">Users</div><b id="users">0</b></div><div class="stat"><div class="muted">Requests</div><b id="requests">0</b></div><div class="stat"><div class="muted">Claims</div><b id="claims">0</b></div></div><section class="card" style="margin-top:14px"><h2>Requests</h2><div id="req" class="history"></div></section><section class="card" style="margin-top:14px"><h2>Users</h2><div id="people" class="history"></div></section><button class="btn red" onclick="logout()">LOGOUT</button></main><script>async function load(){let r=await fetch("/api/admin/data");if(r.status===401){location.href="/admin-login.html";return}let x=await r.json();users.textContent=x.users.length;requests.textContent=x.requests.length;claims.textContent=x.claims.length;req.innerHTML=x.requests.map(a=>'<div class="history-item"><div><b>'+a.id+'</b><div class="muted small">'+a.uid+' • '+a.kind+' • '+a.amount.toLocaleString()+'</div></div><div><span class="status '+a.status.toLowerCase()+'">'+a.status+'</span>'+(a.status==="PENDING"?' <button class="btn green" onclick="act(\''+a.id+'\',\'APPROVED\')">Approve</button> <button class="btn red" onclick="act(\''+a.id+'\',\'REJECTED\')">Reject</button>':'')+'</div></div>').join('')||'<div class="notice">No requests.</div>';people.innerHTML=x.users.map(a=>'<div class="history-item"><b>'+a.id+'</b><b>'+Number(a.balance).toLocaleString()+'</b></div>').join('')||'<div class="notice">No users.</div>'}async function act(id,status){await fetch("/api/admin/request",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,status})});load()}async function logout(){await fetch("/api/admin/logout",{method:"POST"});location.href="/admin-login.html"}load()</script></body></html>
