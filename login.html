<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAHADEV BOOK - Login</title><link rel="stylesheet" href="/styles.css"></head><body><main class="wrap" style="max-width:520px;padding-top:9vh"><div class="card"><div class="brand" style="text-align:center;font-size:34px">♛ MAHADEV BOOK ♛</div><h2 style="text-align:center">WELCOME BACK</h2><form id="f" class="form"><label>Player ID / Mobile<input id="u" required></label><label>Password<input id="p" type="password" required></label><button class="btn gold">LOGIN</button><div id="m"></div></form><p style="text-align:center"><a href="/register.html" style="color:var(--gold)">Register Now</a></p></div></main><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({playerId:u.value,password:p.value})});let x=await r.json();m.className=r.ok?"success":"error";m.textContent=r.ok?"Login successful.":" "+x.error;if(r.ok)location.href="/";}</script></body></html>
