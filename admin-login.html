<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAHADEV BOOK - Admin Login</title><link rel="stylesheet" href="/styles.css"></head><body><main class="wrap" style="max-width:520px;padding-top:9vh"><div class="card"><div class="brand" style="text-align:center">♛ MAHADEV BOOK ADMIN ♛</div><form id="f" class="form"><label>Admin Password<input id="p" type="password"></label><button class="btn gold">LOGIN</button><div id="m"></div></form></div></main><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:p.value})});let x=await r.json();m.className=r.ok?"success":"error";m.textContent=r.ok?"":" "+x.error;if(r.ok)location.href="/admin.html"}</script></body></html>
