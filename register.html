<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REDDY COIN | Create ID</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:radial-gradient(circle at 20% 0,#2a0a0d,#090b11 45%,#050608);color:#fff;min-height:100vh;display:grid;place-items:center;padding:20px}.wrap{width:min(430px,100%)}.brand{text-align:center;font-size:33px;font-weight:900;letter-spacing:3px;margin-bottom:25px}.card{background:#11151eee;border:1px solid #f0444438;border-radius:24px;padding:25px}.muted{color:#9da8b5}label{display:block;color:#c9d0d7;font-size:13px;margin:16px 0 7px}input{width:100%;padding:15px;border-radius:13px;border:1px solid #313b48;background:#0a0d12;color:#fff;font-size:16px}button{width:100%;padding:15px;border:0;border-radius:13px;background:linear-gradient(90deg,#df1d2d,#ff4c37);color:#fff;font-weight:900;margin-top:18px}.msg{min-height:22px;color:#ff9c9c}.small{text-align:center;margin-top:18px;color:#98a4b1}.small a{color:#ff6a62}</style></head><body><main class=wrap><div class=brand>REDDY COIN 🪙</div><section class=card><h1>Create ID</h1><p class=muted>Create your member ID and password.</p><form id=f><label>New ID</label><input id=id required><label>Password</label><input id=pw type=password minlength=4 required><button>CREATE ID</button></form><div id=m class=msg></div><div class=small>Already have an account? <a href="/">Login</a></div></section></main><script>
f.onsubmit=async e=>{e.preventDefault();const r=await fetch("/api/register",{credentials:"same-origin",method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:id.value,password:pw.value})});const d=await r.json();if(!r.ok){m.textContent=d.error;return}location="/home"}</script></body></html>
