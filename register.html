<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAHADEV BOOK - Register</title><link rel="stylesheet" href="/styles.css"></head><body><main class="wrap" style="max-width:520px;padding-top:9vh"><div class="card"><div class="brand" style="text-align:center">♛ MAHADEV BOOK ♛</div><h2>REGISTER</h2><form id="f" class="form"><label>Player ID<input id="u" required></label><label>Password<input id="p" type="password" minlength="6" required></label><label>Confirm Password<input id="c" type="password" minlength="6" required></label><button class="btn gold">REGISTER</button><div id="m"></div></form></div></main><script>f.onsubmit=async e=>{e.preventDefault();if(p.value!==c.value){m.className="error";m.textContent="Passwords do not match.";return}let r=await fetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({playerId:u.value,password:p.value})});let x=await r.json();m.className=r.ok?"success":"error";m.textContent=r.ok?"Account created.":" "+x.error;if(r.ok)location.href="/";}</script></body></html>
