<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REDDY COIN • Create ID</title>
<style>*{box-sizing:border-box}body{margin:0;background:#060a10;color:#fff;font-family:Arial}.wrap{width:min(450px,100%);margin:auto;padding:28px 16px}.brand{text-align:center;font-size:32px;font-weight:900;letter-spacing:4px;margin:20px}.card{background:#0f1722;border:1px solid #ff263f88;border-radius:24px;padding:24px}h2{text-align:center}.muted{text-align:center;color:#99a6b3}label{display:block;color:#aab7c4;font-size:13px;margin:14px 0 7px}input{width:100%;padding:15px;border-radius:13px;border:1px solid #354353;background:#080f17;color:#fff;font-size:16px}button{width:100%;padding:15px;border:0;border-radius:13px;background:linear-gradient(90deg,#16b981,#2563eb);color:#fff;font-weight:900;margin-top:18px}.msg{text-align:center;color:#ff9393;min-height:20px;margin-top:12px}a{color:#ffd32d}</style></head>
<body><main class="wrap"><div class="brand">REDDY COIN</div><section class="card"><h2>Create Your ID</h2><p class="muted">Create your member account.</p><form id="form"><label>Create ID</label><input id="u" required><label>Password</label><input id="p" type="password" minlength="4" required><button>CREATE ID</button></form><div id="m" class="msg"></div><p class="muted">Already registered? <a href="/">Login</a></p></section></main>
<script>
document.getElementById("form").addEventListener("submit",async e=>{
 e.preventDefault();const m=document.getElementById("m");
 const r=await fetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("u").value,password:document.getElementById("p").value})});
 const d=await r.json(); if(!r.ok){m.textContent=d.error;return}
 localStorage.setItem("reddy_player_token",d.token); location.href="/home";
});
</script></body></html>
