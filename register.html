<!doctype html><html><meta name=viewport content="width=device-width,initial-scale=1"><title>REDDY COIN</title><style>body{margin:0;font-family:Arial;background:linear-gradient(135deg,#101820,#34495e);color:#fff}.w{max-width:430px;margin:auto;padding:35px 18px}.b{text-align:center;font-size:32px;font-weight:900;letter-spacing:3px;margin:25px}.c{background:#fff;color:#17202a;padding:25px;border-radius:24px}input,button{width:100%;padding:15px;margin:7px 0;border-radius:12px;font-size:16px;box-sizing:border-box}button{background:#17202a;color:white;border:0;font-weight:800}.e{color:#c62828;text-align:center;font-weight:700}.sw{text-align:center;margin-top:12px}</style><body><div class=w><div class=b>REDDY COIN</div><div class=c><h2>Create ID</h2><input id=u placeholder="Create ID"><input id=p type=password placeholder="Password"><input id=p2 type=password placeholder="Confirm Password"><button onclick=go()>CREATE ID</button><p id=m></p><div class=sw>Already registered? <a href=# onclick=login()>Login</a></div></div></div><script>async function go(){if(p.value!=p2.value){m.className='e';m.textContent='Passwords do not match';return}let r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})}),x=await r.json();if(r.ok)location='/home.html';else{m.className='e';m.textContent=x.error}}function login(){let b=document.querySelector('button');p2.style.display='none';b.textContent='LOGIN';b.onclick=async()=>{let r=await fetch('/api/player-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});let x=await r.json();if(r.ok)location='/home.html';else m.textContent=x.error}}</script></body></html>
