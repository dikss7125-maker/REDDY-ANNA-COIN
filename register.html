</style></head><body><main class="container" style="max-width:470px;padding-top:9vh"><div class="card"><div class="brand" style="text-align:center;font-size:30px">♛ MHADEV BOOK ♛</div><h1>Create Account</h1><form id="f" class="form"><label>Player ID<input id="u" required pattern="[A-Za-z0-9_]{4,24}"></label><label>Password<input id="p" type="password" minlength="6" required></label><label>Confirm Password<input id="c" type="password" minlength="6" required></label><button class="btn gold">REGISTER</button><div id="m"></div></form><p style="text-align:center"><a href="/login.html" style="color:var(--gold)">Back to Login</a></p></div></main><script>f.onsubmit=async e=>{e.preventDefault();if(p.value!==c.value){m.className='error';m.textContent='Passwords do not match.';return}let r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({playerId:u.value,password:p.value})});let x=await r.json();m.className=r.ok?'success':'error';m.textContent=r.ok?'Account created.':x.error;if(r.ok)location.href='/'}</script></body></html>
