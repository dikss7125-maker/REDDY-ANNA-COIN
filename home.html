<!doctype html><html><meta name=viewport content="width=device-width,initial-scale=1"><title>REDDY COIN</title><style>body{margin:0;font-family:Arial;background:#f3f5f7;color:#17202a}.w{max-width:560px;margin:auto;padding:18px}.top{font-size:26px;font-weight:900;letter-spacing:2px}.hero{margin-top:18px;background:linear-gradient(135deg,#111820,#3a4b5a);color:#fff;padding:25px;border-radius:24px}.n{font-size:28px;font-weight:900}.bal{font-size:36px;font-weight:900;margin-top:10px}.c{background:white;padding:20px;border-radius:20px;margin-top:16px;box-shadow:0 5px 20px #0001}input,button{padding:14px;border-radius:12px;font-size:16px}input{width:calc(100% - 120px);border:1px solid #ddd}button{width:105px;background:#17202a;color:#fff;border:0;font-weight:800}.ok{color:#167a38;font-weight:800}.err{color:#c62828;font-weight:800}</style><body><div class=w><div class=top>REDDY COIN</div><div class=hero><div>Welcome back</div><div class=n id=n>Player</div><div class=bal id=b>₹0 Rewards</div></div><div class=c><h2>Bonus Claim</h2><input id=c placeholder="Bonus Code"><button onclick=claim()>CLAIM</button><p id=m></p></div><div class=c><button style="width:100%" onclick="logout()">LOG OUT</button></div></div><script>async function load(){let r=await fetch('/api/me');if(!r.ok){location='/';return}let x=await r.json();n.textContent=x.username;b.textContent='₹'+x.coins.toLocaleString()+' Rewards'}async function claim(){let r=await fetch('/api/player-claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:c.value})}),x=await r.json();m.className=r.ok?'ok':'err';m.textContent=r.ok?'₹'+x.value.toLocaleString()+' reward added successfully.':x.error;if(r.ok){c.value='';load()}}async function logout(){await fetch('/api/player-logout',{method:'POST'});location='/' }load()</script></body></html>
