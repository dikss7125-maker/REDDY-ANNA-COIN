<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REDDY COIN • Home</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#070d15;color:#fff}.top{padding:20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff10}.brand{font-weight:900;letter-spacing:3px}.logout{background:#172333;color:#fff;border:1px solid #ffffff16;padding:10px 14px;border-radius:12px}.box{width:min(720px,100%);margin:auto;padding:22px 16px}.hero,.card,.stat{background:#0e1925;border:1px solid #ffffff10;border-radius:26px;padding:24px}.hello{color:#94a7b8}.coins{font-size:44px;font-weight:900;margin-top:8px}.muted{color:#91a4b6}h2{margin:0 0 8px}.card{margin-top:18px}input{width:100%;padding:16px;margin-top:14px;border-radius:15px;border:1px solid #304153;background:#08111a;color:#fff;font-size:17px}button{width:100%;padding:16px;margin-top:14px;border:0;border-radius:15px;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;font-weight:900;font-size:16px}.msg{min-height:24px;margin-top:14px;color:#9ff2c9}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.stat b{display:block;font-size:21px;margin-top:5px}.support{display:none;margin-top:18px;padding:18px;border-radius:20px;background:#101f2e}.support a{color:#8bdcff}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand">REDDY COIN 🪙</div><button class="logout" onclick="out()">Logout</button></header><main class="box"><section class="hero"><div class="hello">Welcome, <b id="member"></b></div><div class="coins"><span id="coins">0</span> 🪙</div><div class="muted">Your current coin balance</div></section><section class="card"><h2>🎁 Claim Bonus</h2><div class="muted">Each bonus code can be claimed only once.</div><input id="code" placeholder="ENTER BONUS CODE"><button onclick="claim()">CLAIM BONUS</button><div id="msg" class="msg"></div></section><div class="grid"><div class="stat">Member ID<b id="member2">—</b></div><div class="stat">Balance<b><span id="coins2">0</span> 🪙</b></div></div><section id="support" class="support"><b>Customer Support</b><div id="st" class="muted" style="margin-top:8px"></div></section></main><script>const u=localStorage.reddyUser;if(!u)location="/";member.textContent=u;member2.textContent=u;async function refresh(){let r=await fetch("/api/user/"+encodeURIComponent(u));if(!r.ok)return out();let d=await r.json();coins.textContent=d.coins;coins2.textContent=d.coins;let s=await fetch("/api/settings").then(x=>x.json());if(s.settings.supportNumber||s.settings.siteLink){support.style.display="block";st.innerHTML=(s.settings.supportNumber?"📞 "+s.settings.supportNumber:"")+(s.settings.siteLink?`<br><a href="${s.settings.siteLink}" target="_blank">Open site link</a>`:"")}}async function claim(){msg.textContent="";let r=await fetch("/api/claim",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:u,code:code.value})}),d=await r.json();if(!r.ok){msg.style.color="#ff9b9b";return msg.textContent=d.error}msg.textContent=`Bonus claimed: ${d.amount} coins added 🪙`;code.value="";refresh()}function out(){localStorage.removeItem("reddyUser");location="/"}refresh()</script></body></html>
