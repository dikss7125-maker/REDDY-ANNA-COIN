<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REDDY COIN | Withdrawal</title><style>
*{box-sizing:border-box}body{margin:0;background:#05070b;color:#fff;font-family:Arial}.top{display:flex;justify-content:space-between;align-items:center;padding:17px 18px;border-bottom:1px solid #ffffff10;position:sticky;top:0;background:#05070bf2;backdrop-filter:blur(10px)}.brand{font-weight:900;letter-spacing:2px}.back{background:#121a25;border:1px solid #ffffff15;color:#fff;padding:10px 13px;border-radius:12px}.wrap{width:min(620px,100%);margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#23070d,#111a25);border:1px solid #ff26364a;border-radius:24px;padding:22px;text-align:center}.balance{font-size:42px;font-weight:900;color:#f5cb27;margin:8px 0}.muted{color:#97a4b2}.card{background:#0e151f;border:1px solid #ffffff10;border-radius:22px;padding:20px;margin-top:16px}.site{background:#101923;border:1px solid #ffffff12;padding:16px;border-radius:16px;margin-top:10px;cursor:pointer}.site.selected{border-color:#ff3344;background:#241015;box-shadow:0 0 0 1px #ff334433}.site b{font-size:17px}.site small{display:block;color:#8d9baa;margin-top:5px}label{display:block;color:#b9c3ce;font-size:13px;margin:14px 0 7px}input,button{width:100%;padding:15px;border-radius:13px;font-size:16px}input{border:1px solid #32404f;background:#080d13;color:#fff}button{border:0;background:linear-gradient(90deg,#df1d2d,#ff4c37);color:#fff;font-weight:900;margin-top:12px}.msg{min-height:24px;margin-top:12px;color:#9cf0bd}.err{color:#ff9c9c}.status{margin-top:16px;padding:13px;border-radius:13px;background:#191b20;color:#ffd166}.history div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #ffffff0b}.pending{color:#ffd166}.approved{color:#9cf0bd}.rejected{color:#ff8e8e}.hidden{display:none}.note{font-size:13px;color:#8795a3;line-height:1.45}
</style></head><body><header class=top><div class=brand id=brand>REDDY COIN 🪙</div><button class=back onclick="location='/home'">← HOME</button></header><main class=wrap><section class=hero><div class=muted>Available Balance</div><div class=balance><span id=balance>0</span> 🪙</div><div class=muted id=minText>Minimum withdrawal: 100 Coins</div></section><section class=card><h2>Withdraw Your Coins</h2><p class=muted>Select your withdrawal site.</p><div id=sites>No active sites available.</div><div id=formBox class=hidden><label>Selected Site</label><div id=selectedSite class=site></div><label>Enter Your ID</label><input id=memberId placeholder="Enter your Member ID"><label>Coins to Withdraw</label><input id=amount type=number min=100 placeholder="Enter coins amount"><div class=note id=note></div><button id=submitBtn>SUBMIT WITHDRAWAL REQUEST</button><div id=msg class=msg></div></div></section><section class=card><h2>Withdrawal History</h2><div id=history class=history>No withdrawal requests yet.</div></section></main><script>
const $=id=>document.getElementById(id);let current=null;function esc(x){return String(x||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
async function load(){const [mr,pr]=await Promise.all([fetch("/api/me",{credentials:"same-origin",cache:"no-store"}),fetch("/api/public",{cache:"no-store"})]);if(!mr.ok){location.replace("/");return}const me=await mr.json(),pub=await pr.json();$('brand').textContent=pub.settings.siteName+" 🪙";$('balance').textContent=me.player.coins;$('minText').textContent="Minimum withdrawal: "+pub.settings.minimumWithdrawal+" Coins";$('note').textContent="Minimum withdrawal is "+pub.settings.minimumWithdrawal+" Coins. Coins are deducted immediately and the request stays PENDING until admin review.";$('amount').min=pub.settings.minimumWithdrawal;$('sites').innerHTML=pub.sites.length?pub.sites.map(s=>`<div class="site" data-id="${s.id}"><b>${esc(s.name)}</b><small>Tap to select this site</small></div>`).join(""):"No active sites available.";document.querySelectorAll('#sites .site').forEach(el=>el.onclick=()=>{current={id:Number(el.dataset.id),name:el.querySelector('b').textContent};document.querySelectorAll('#sites .site').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');$('formBox').classList.remove('hidden');$('selectedSite').textContent=current.name});renderHistory(me.withdrawals)}
function renderHistory(a){$('history').innerHTML=a.length?a.map(x=>`<div><span>${esc(x.site_name)}<br><small>${esc(x.member_id)}</small></span><b class="${x.status.toLowerCase()}">${esc(x.status)}<br>${x.coins} 🪙</b></div>`).join(""):"No withdrawal requests yet."}
$('submitBtn').onclick=async()=>{if(!current){$('msg').className='msg err';$('msg').textContent='Please select your site first.';return}const coins=Number($('amount').value);if(!Number.isInteger(coins)){ $('msg').className='msg err';$('msg').textContent='Enter a whole-number coin amount.';return}const r=await fetch('/api/withdraw',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({siteId:current.id,memberId:$('memberId').value,coins})}),d=await r.json().catch(()=>({}));if(!r.ok){$('msg').className='msg err';$('msg').textContent=d.error||'Withdrawal request failed.';return}$('msg').className='msg';$('msg').textContent='Request created successfully. Status: PENDING.';$('memberId').value='';$('amount').value='';load()};load();
</script></body></html>
