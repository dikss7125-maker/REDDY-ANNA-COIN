<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MHADEV BOOK - Casino</title>
<style>
:root{--bg:#05070b;--panel:#0d141d;--line:#27384a;--gold:#f5c542;--gold2:#ffe178;--muted:#93a1b1;--red:#ef3f4d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 420px at 50% -10%,#1c2b3b,transparent 65%),linear-gradient(180deg,#04070b,#020408);color:#fff;font-family:Inter,Arial,sans-serif}
a{text-decoration:none;color:inherit}.container{max-width:1200px;margin:auto;padding:14px}.top{display:flex;align-items:center;gap:12px;min-height:64px;border-bottom:1px solid #ffffff0d}.brand{font-size:21px;font-weight:1000;color:var(--gold)}.brand small{display:block;font-size:8px;letter-spacing:3px;text-align:center;color:#aab5c2}.spacer{flex:1}.coin{padding:9px 12px;border:1px solid var(--line);border-radius:11px;background:#0b1118}.hero{margin-top:16px;padding:22px;border:1px solid #6c551b;border-radius:18px;background:linear-gradient(130deg,#211707,#0d1721 60%,#090e14);position:relative;overflow:hidden}.hero h1{margin:7px 0;color:var(--gold2);font-size:32px}.hero p{color:#aeb9c5;margin:0}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#191507;color:var(--gold2);font-size:10px;font-weight:900}.head{display:flex;justify-content:space-between;align-items:end;margin:20px 0 10px}.head h2{margin:0}.muted{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#0e1720,#090f15);cursor:pointer;transition:.16s}.card:hover{transform:translateY(-2px);border-color:#69521a}.art{height:155px;display:grid;place-items:center;position:relative;overflow:hidden}.art:before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;border:1px solid #ffffff18;box-shadow:0 0 70px #000 inset}.art span{font-size:64px;position:relative;filter:drop-shadow(0 12px 22px #000b)}.lock{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#05070bcc;border:1px solid #f5c54266;font-size:18px}.body{padding:12px}.body b{font-size:15px}.provider{color:#8290a0;font-size:10px;margin-top:5px}.lockedLabel{margin-top:9px;color:#ffe178;font-size:10px;font-weight:900}.overlay{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:100;padding:18px}.modal{width:min(390px,100%);padding:22px;border-radius:18px;background:#0d1722;border:1px solid #66531f;text-align:center;box-shadow:0 20px 80px #000}.modal .big{font-size:44px}.modal h2{margin:8px 0;color:var(--gold2)}.modal p{color:#aeb9c5;font-size:13px;line-height:1.5}.close{margin-top:12px;padding:11px 18px;border:0;border-radius:10px;background:var(--gold);font-weight:900}.notice{padding:11px;border:1px solid #2b3d50;border-radius:11px;background:#101a24;color:#b8c5d2}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.art{height:130px}}@media(max-width:520px){.grid{gap:9px}.art{height:112px}.art span{font-size:48px}.body{padding:10px}.hero h1{font-size:27px}}
</style></head>
<body>
<header><div class="container top"><a class="brand" href="/">♛ MHADEV BOOK ♛<small>CASINO</small></a><div class="spacer"></div><div class="coin">🪙 <b id="bal">0</b></div></div></header>
<main class="container">
<section class="hero"><span class="tag">PREMIUM CASINO</span><h1>Casino Games</h1><p>10 premium games • All games locked for testing.</p></section>
<div class="head"><div><h2>Featured Games</h2><span class="muted">🔐 Tap any game to view lock notice</span></div></div>
<div id="grid" class="grid"></div>
<div id="globalNotice" class="notice" style="margin-top:14px">Checking casino lock status…</div>
</main>
<div id="modal" class="overlay" onclick="if(event.target===this)closeLock()"><div class="modal"><div class="big">🔐</div><h2 id="modalTitle">Game Locked</h2><p id="modalText">This game is currently locked by the Master Panel.</p><button class="close" onclick="closeLock()">OK</button></div></div>
<script>
const games=[
 ['Aviator','✈️','linear-gradient(135deg,#15110a,#6b210f,#0b1520)'],
 ['Dragon Tiger','🐉','linear-gradient(135deg,#251007,#7d2a0c,#12100b)'],
 ['Baccarat','🃏','linear-gradient(135deg,#071a16,#12644f,#0b1118)'],
 ['Blackjack','♠️','linear-gradient(135deg,#07170f,#176c3a,#0b1118)'],
 ['Roulette','🎡','linear-gradient(135deg,#1b090d,#8b1731,#0a1118)'],
 ['Sweet Bonanza','🍭','linear-gradient(135deg,#190b26,#7c2ab1,#0b1720)'],
 ['Gates of Olympus','⚡','linear-gradient(135deg,#0b1731,#245bb0,#6c4310)'],
 ['Mines','💎','linear-gradient(135deg,#071728,#1263a1,#0b1118)'],
 ['Crash','🚀','linear-gradient(135deg,#17100a,#c15b0d,#0b1118)'],
 ['Dice','🎲','linear-gradient(135deg,#15100a,#755313,#0b1118)']
];
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){grid.innerHTML=games.map((g,i)=>`<div class="card" onclick="openLock('${esc(g[0])}')"><div class="art" style="background:${g[2]}"><span>${g[1]}</span><div class="lock">🔐</div></div><div class="body"><b>${esc(g[0])}</b><div class="provider">Premium Game</div><div class="lockedLabel">🔐 LOCKED</div></div></div>`).join('')}
function openLock(name){modalTitle.textContent=name+' — Locked';modalText.textContent='This game is locked by the Master Panel. Please contact support for access.';modal.style.display='grid'}
function closeLock(){modal.style.display='none'}
async function init(){
 const me=await fetch('/api/me',{cache:'no-store'}).then(r=>r.json()).catch(()=>({loggedIn:false}));
 if(!me.loggedIn)return location.href='/login.html';
 bal.textContent=Number(me.user.balance||0).toLocaleString();
 const r=await fetch('/api/public/locks',{cache:'no-store'}).then(x=>x.json()).catch(()=>({locks:{casino:true}}));
 const locked=r.locks?.casino===false;
 globalNotice.textContent=locked?'🔒 Casino is locked by Master Panel.':'🔐 Games are locked for testing.';
 if(locked) globalNotice.textContent='🔒 Casino is currently locked by Master Panel.';
}
render();init();
</script></body></html>
