<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Master Login</title><style>body{margin:0;background:#071019;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.box{width:min(420px,90vw);padding:28px;border:1px solid #263b50;border-radius:18px;background:#0c1722;box-shadow:0 20px 70px #0008}h1{margin:0 0 6px;color:#f5c542}p{color:#91a3b5}label{display:grid;gap:8px;color:#b8c7d5;font-size:13px}input{padding:13px;border-radius:10px;border:1px solid #30475c;background:#08111a;color:#fff}button{padding:13px;border:0;border-radius:10px;background:#f5c542;font-weight:900;cursor:pointer;margin-top:12px;width:100%}.msg{margin-top:12px;padding:10px;border-radius:9px;background:#32151b;color:#ff9ca6}</style></head><body><main class="box"><h1>👑 MASTER PANEL</h1><p>Highest-level control</p><form id="f"><label>MASTER PASSWORD<input id="p" type="password" autocomplete="current-password" required></label><button>LOGIN</button><div id="m"></div></form></main><script>f.onsubmit=async e=>{e.preventDefault();m.className='';m.textContent='Checking…';const r=await fetch('/api/master/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p.value})});const x=await r.json().catch(()=>({}));if(!r.ok){m.className='msg';m.textContent=x.error||'Login failed';return}location.href='/master.html'}</script></body></html>
