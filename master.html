<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Master Panel</title><style>:root{--bg:#071019;--card:#0d1925;--line:#263b50;--gold:#f5c542;--muted:#91a3b5;--green:#62e79a;--red:#ff7180}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#050b11,#0a1420);color:#eef5fb;font-family:Arial,sans-serif}.wrap{max-width:1450px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}.brand{font-size:24px;font-weight:900;color:var(--gold)}.sub{color:var(--muted);font-size:12px;margin-top:4px}.btn{border:1px solid var(--line);background:#101e2b;color:#fff;padding:10px 13px;border-radius:9px;font-weight:800;cursor:pointer}.btn.gold{background:var(--gold);color:#171200;border-color:var(--gold)}.btn.red{background:#3a161d;color:#ffb0b8;border-color:#63252e}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:linear-gradient(180deg,#0d1925,#0a141e);border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 14px 35px #0004}.stat small{color:var(--muted);font-weight:700}.stat b{display:block;font-size:26px;margin-top:7px;color:var(--gold)}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px;margin-top:14px}.nav{position:sticky;top:15px;height:max-content}.nav button{width:100%;text-align:left;margin:4px 0}.nav button.active{border-color:#765e19;background:#241c08;color:var(--gold)}section{display:none}.section{display:grid;gap:12px}.section.active{display:grid}.h{display:flex;align-items:center;justify-content:space-between;gap:10px}.h h2{margin:0;font-size:19px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 7px;border-bottom:1px solid #1c2d3e;text-align:left;font-size:12px;vertical-align:top}.pill{display:inline-block;padding:4px 7px;border-radius:999px;background:#17283a;color:#b8d8f6;font-size:10px;font-weight:900}.green{color:var(--green)}.red{color:var(--red)}.form{display:grid;gap:9px}.form input,.form select,.form textarea{width:100%;padding:11px;border-radius:9px;border:1px solid #2a4156;background:#08111a;color:#fff}.cols{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.feature{padding:9px;border:1px solid #23394d;border-radius:9px;background:#0a141e}.feature label{display:flex;gap:8px;align-items:center;font-size:12px}.notice{padding:10px;border-radius:9px;background:#111f2c;color:#b7c8d7}.lock{color:#f5c542}.actions{display:flex;gap:6px;flex-wrap:wrap}.toast{position:fixed;right:18px;bottom:18px;max-width:380px;padding:12px 15px;border-radius:10px;background:#102233;border:1px solid #35516b;display:none}.search{padding:10px;border-radius:9px;border:1px solid #2a4156;background:#08111a;color:#fff;width:100%}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.nav{position:static}.cols,.features{grid-template-columns:1fr 1fr}}@media(max-width:560px){.wrap{padding:11px}.grid{grid-template-columns:1fr}.cols,.features{grid-template-columns:1fr}.table{min-width:720px}.scroll{overflow:auto}.brand{font-size:20px}}</style></head><body><div class="wrap"><div class="top"><div><div class="brand">👑 MASTER PANEL</div><div class="sub">Client • License • Credit • Feature • Security Control</div></div><button class="btn red" onclick="logout()">LOGOUT</button></div><div id="stats" class="grid"></div><div class="layout"><aside class="nav card"><button class="btn active" data-s="dashboard">📊 Dashboard</button><button class="btn" data-s="clients">👥 Clients / Admins</button><button class="btn" data-s="coins">💰 Coin / Credit</button><button class="btn" data-s="licenses">🔐 License & Features</button><button class="btn" data-s="locks">🔒 Site Locks</button><button class="btn" data-s="finance">📈 P/L & Finance</button><button class="btn" data-s="security">🛡 Security</button><button class="btn" data-s="logs">📋 Audit Logs</button><button class="btn" data-s="settings">⚙ Global Settings</button><div class="notice" style="margin-top:12px">Locked features remain visible in Admin and must be enforced server-side.</div></aside><main><section id="dashboard" class="section active"></section><section id="clients" class="section"></section><section id="coins" class="section"></section><section id="licenses" class="section"></section><section id="locks" class="section"></section><section id="finance" class="section"></section><section id="security" class="section"></section><section id="logs" class="section"></section><section id="settings" class="section"></section></main></div></div><div id="toast" class="toast"></div><script>let data={};let currentClient='';const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=x=>Number(x||0).toLocaleString('en-IN');function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||'Request failed');return x}async function load(){try{data=await api('/api/master/overview');data.settings=data.settings||{};data.settings.locks=data.settings.locks||data.settings;renderStats();render();renderLocks()}catch(e){location.href='/master-login.html'}}function renderStats(){$('stats').innerHTML=`<div class="card stat"><small>CLIENTS / ADMINS</small><b>${data.clients.length}</b></div><div class="card stat"><small>TOTAL USERS</small><b>${money(data.users)}</b></div><div class="card stat"><small>USER BALANCE</small><b>${money(data.totalUserBalance)}</b></div><div class="card stat"><small>SITE P/L</small><b class="${data.sitePL>=0?'green':'red'}">${data.sitePL>=0?'+':'−'}${money(Math.abs(data.sitePL))}</b></div>`}function clientRows(){return data.clients.map(c=>`<tr><td><b>${esc(c.id)}</b><br><small>${esc(c.name)}</small></td><td><span class="pill">${esc(c.package)}</span><br>${c.status==='ACTIVE'?'<span class="green">ACTIVE</span>':'<span class="red">SUSPENDED</span>'}</td><td>${money(c.allocatedCoins)}</td><td>${Object.entries(c.features).filter(([,v])=>v).map(([k])=>esc(k)).join(', ')||'Basic'}</td><td class="actions"><button class="btn" onclick="editClient('${esc(c.id)}')">Manage</button><button class="btn" onclick="setClientPass('${esc(c.id)}')">Admin Password</button><button class="btn red" onclick="suspend('${esc(c.id)}')">${c.status==='ACTIVE'?'Suspend':'Activate'}</button></td></tr>`).join('')||'<tr><td colspan="5">No clients yet.</td></tr>'}function render(){ $('dashboard').innerHTML=`<div class="card"><div class="h"><h2>Master Overview</h2><span class="pill">MASTER LEVEL</span></div><div class="grid" style="margin-top:12px"><div class="notice">Approved Deposits<br><b>${money(data.approvedDeposits)}</b></div><div class="notice">Approved Withdrawals<br><b>${money(data.approvedWithdrawals)}</b></div><div class="notice">Active Licenses<br><b>${data.clients.filter(x=>x.status==='ACTIVE').length}</b></div><div class="notice">Locked Modules<br><b>${data.clients.reduce((n,c)=>n+Object.values(c.features).filter(v=>!v).length,0)}</b></div></div></div><div class="card"><div class="h"><h2>Quick Actions</h2></div><div class="actions" style="margin-top:12px"><button class="btn gold" onclick="show('clients')">ADD CLIENT</button><button class="btn" onclick="show('licenses')">FEATURE CONTROL</button><button class="btn" onclick="show('coins')">ALLOCATE COINS</button><button class="btn" onclick="show('finance')">VIEW P/L</button></div></div>`;$('clients').innerHTML=`<div class="card"><div class="h"><h2>Clients / Admins</h2><button class="btn gold" onclick="newClient()">+ ADD CLIENT</button></div><div class="scroll" style="margin-top:12px"><table class="table"><thead><tr><th>Client</th><th>Status / Package</th><th>Allocated</th><th>Features</th><th>Actions</th></tr></thead><tbody>${clientRows()}</tbody></table></div></div>`;$('coins').innerHTML=`<div class="card"><div class="h"><h2>Coin / Credit Management</h2></div><div class="notice" style="margin:12px 0">Allocate the maximum coin capacity assigned to each client. Positive adds credit; negative reduces unspent allocation.</div><div class="scroll"><table class="table"><thead><tr><th>Client</th><th>Allocated</th><th>Change</th><th>Action</th></tr></thead><tbody>${data.clients.map(c=>`<tr><td><b>${esc(c.id)}</b></td><td>${money(c.allocatedCoins)}</td><td><input id="coin_${esc(c.id)}" type="number" class="search" placeholder="+1000 / -1000"></td><td><button class="btn gold" onclick="coin('${esc(c.id)}')">UPDATE</button></td></tr>`).join('')||'<tr><td colspan="4">No clients.</td></tr>'}</tbody></table></div></div>`;$('licenses').innerHTML=`<div class="card"><div class="h"><h2>License & Feature Control</h2></div><div class="notice" style="margin:12px 0">Features stay visible in Admin but show 🔐 when locked. Unlock state is stored server-side.</div><div class="scroll"><table class="table"><thead><tr><th>Client</th><th>Package</th><th>Price</th><th>Features</th><th>Save</th></tr></thead><tbody>${data.clients.map(c=>`<tr><td><b>${esc(c.id)}</b></td><td><select id="pkg_${esc(c.id)}" class="search"><option>BASIC</option><option>PRO</option><option>LIVE</option><option>CUSTOM</option></select></td><td><input id="price_${esc(c.id)}" class="search" type="number" value="${Number(c.price||0)}"></td><td><div class="features">${Object.entries(c.features).map(([k,v])=>`<div class="feature"><label><input id="f_${esc(c.id)}_${k}" type="checkbox" ${v?'checked':''}> ${v?'🔓':'🔐'} ${esc(k)}</label></div>`).join('')}</div></td><td><button class="btn gold" onclick="saveLicense('${esc(c.id)}')">SAVE</button></td></tr>`).join('')||'<tr><td colspan="5">No clients.</td></tr>'}</tbody></table></div></div>`;data.clients.forEach(c=>{const p=$('pkg_'+c.id);if(p)p.value=c.package});$('finance').innerHTML=`<div class="cols"><div class="card"><div class="h"><h2>Site P/L</h2><span class="pill">DEMO-COIN LEDGER</span></div><div class="grid" style="margin-top:12px"><div class="notice">Deposits<br><b>${money(data.approvedDeposits)}</b></div><div class="notice">Withdrawals<br><b>${money(data.approvedWithdrawals)}</b></div><div class="notice">Net<br><b class="${data.sitePL>=0?'green':'red'}">${data.sitePL>=0?'+':'−'}${money(Math.abs(data.sitePL))}</b></div><div class="notice">User Balance<br><b>${money(data.totalUserBalance)}</b></div></div></div><div class="card"><h2>Important</h2><p class="sub">P/L is calculated from approved deposits minus approved withdrawals. User balances are shown separately and are not treated as profit.</p></div></div>`;$('security').innerHTML=`<div class="cols"><div class="card"><h2>Admin Password / Sessions</h2><form class="form" onsubmit="resetAdmin(event)"><input id="newpass" type="password" minlength="8" placeholder="New Admin password (8+ chars)" required><button class="btn gold">CHANGE ADMIN PASSWORD</button></form><div class="notice" style="margin-top:10px">The existing project uses one global ADMIN_PASSWORD environment variable. Password activation requires updating that Railway variable.</div></div><div class="card"><h2>Force Admin Logout</h2><p class="sub">This project currently has one shared Admin session. Revoking it logs out all current Admin sessions.</p><button class="btn red" onclick="forceAll()">REVOKE ADMIN SESSIONS</button><button class="btn" onclick="backup()">DOWNLOAD BACKUP</button></div></div>`;$('logs').innerHTML=`<div class="card"><div class="h"><h2>Audit Logs</h2></div><div class="history">${(data.audit||[]).map(a=>`<div class="notice"><b>${esc(a.action)}</b><br>${esc(a.detail)}<br><small>${new Date(a.time).toLocaleString()}</small></div>`).join('')||'<div class="notice">No audit activity yet.</div>'}</div></div>`;$('settings').innerHTML=`<div class="card"><h2>Global Settings</h2><form class="form" onsubmit="saveSettings(event)"><label>Master note<textarea id="masterNote" rows="4">${esc(data.settings?.note||'')}</textarea></label><button class="btn gold">SAVE SETTINGS</button></form></div>`
function renderLocks(){
 const l=data.settings?.locks||{casino:true,matches:true,odds:true};
 $('locks').innerHTML=`<div class="card"><div class="h"><h2>🔒 Global Site Locks</h2></div>
 <div class="notice" style="margin:10px 0">These controls are global. They do not change the user's coin balance.</div>
 <div class="features">
 <div class="feature"><label><input id="lockCasino" type="checkbox" ${l.casino!==false?'checked':''}> Casino unlocked</label><small>Uncheck to lock Casino.</small></div>
 <div class="feature"><label><input id="lockMatches" type="checkbox" ${l.matches!==false?'checked':''}> Matches unlocked</label><small>Uncheck to lock match pages.</small></div>
 <div class="feature"><label><input id="lockOdds" type="checkbox" ${l.odds!==false?'checked':''}> Odds unlocked</label><small>Uncheck to lock all odds.</small></div>
 </div>
 <button class="btn gold" style="margin-top:12px" onclick="saveLocks()">SAVE LOCK SETTINGS</button></div>`;
}
async function saveLocks(){
 try{
  const locks={casino:$('lockCasino').checked,matches:$('lockMatches').checked,odds:$('lockOdds').checked};
  const x=await api('/api/master/locks',{method:'POST',body:JSON.stringify(locks)});
  data.settings=data.settings||{};data.settings.locks=x.locks;toast('Lock settings saved');renderLocks();
 }catch(e){toast(e.message)}
}
}function show(s){document.querySelectorAll('main section').forEach(x=>x.classList.toggle('active',x.id===s));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.s===s))}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.s));function newClient(){const id=prompt('Client/Admin ID');if(!id)return;const name=prompt('Client name',id);api('/api/master/client',{method:'POST',body:JSON.stringify({id,name,package:'BASIC',price:5000})}).then(()=>{toast('Client created');load()}).catch(e=>toast(e.message))}function editClient(id){const c=data.clients.find(x=>x.id===id);if(!c)return;const name=prompt('Client name',c.name);if(name===null)return;api('/api/master/client/'+encodeURIComponent(id),{method:'POST',body:JSON.stringify({name})}).then(()=>load()).catch(e=>toast(e.message))}function suspend(id){const c=data.clients.find(x=>x.id===id);api('/api/master/client/'+encodeURIComponent(id),{method:'POST',body:JSON.stringify({status:c.status==='ACTIVE'?'SUSPENDED':'ACTIVE'})}).then(()=>load()).catch(e=>toast(e.message))}function coin(id){const v=Number($('coin_'+id).value);if(!v)return;api('/api/master/client/'+encodeURIComponent(id)+'/coins',{method:'POST',body:JSON.stringify({amount:v})}).then(()=>{toast('Coin allocation updated');load()}).catch(e=>toast(e.message))}function saveLicense(id){const c=data.clients.find(x=>x.id===id);const features={};for(const k of Object.keys(c.features))features[k]=$('f_'+id+'_'+k).checked;api('/api/master/client/'+encodeURIComponent(id),{method:'POST',body:JSON.stringify({package:$('pkg_'+id).value,price:Number($('price_'+id).value),features})}).then(()=>{toast('License updated');load()}).catch(e=>toast(e.message))}async function resetAdmin(e){e.preventDefault();try{const x=await api('/api/master/admin-password-reset',{method:'POST',body:JSON.stringify({password:$('newpass').value})});toast(x.warning||'Admin password updated');e.target.reset()}catch(e){toast(e.message)}}async function setClientPass(id){const pass=prompt('New Admin password (8+ chars)');if(pass===null)return;try{await api('/api/master/client/'+encodeURIComponent(id)+'/password',{method:'POST',body:JSON.stringify({password:pass})});toast('Client Admin password updated')}catch(e){toast(e.message)}}async function backup(){try{const r=await fetch('/api/master/backup',{credentials:'same-origin'});if(!r.ok)throw Error('Backup failed');const b=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='master-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup downloaded')}catch(e){toast(e.message)}}async function forceAll(){if(!confirm('Revoke ALL current Admin sessions?'))return;try{const x=await api('/api/master/revoke-admin-sessions',{method:'POST',body:'{}'});toast(x.warning||'Sessions revoked');load()}catch(e){toast(e.message)}}async function saveSettings(e){e.preventDefault();try{await api('/api/master/settings',{method:'POST',body:JSON.stringify({note:$('masterNote').value})});toast('Saved');load()}catch(e){toast(e.message)}}async function logout(){await fetch('/api/master/logout',{method:'POST'});location.href='/master-login.html'}load();</script></body></html>
