<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAHADEV BOOK</title><link rel="stylesheet" href="/styles.css"></head><body><header class="top wrap"><a class="brand" href="/">♛ MAHADEV BOOK ♛</a><nav class="nav"><a href="/">Home</a><a href="/matches.html">Matches</a><a href="/casino.html">Casino</a><a href="/wallet.html">Wallet</a><a href="/profile.html">Profile</a></nav><div class="bal">🪙 <span id="bal">0</span></div></header><main class="wrap"><div class="grid2"><section class="card"><h2>Game History</h2><div id="games" class="history"></div></section><section class="card"><h2>Wallet History</h2><div id="wallet" class="history"></div></section></div></main><script>async function load(){let m=await fetch("/api/me").then(r=>r.json());if(!m.loggedIn){location.href="/login.html";return}let h=await fetch("/api/history").then(r=>r.json());games.innerHTML=h.games.map(x=>'<div class="history-item"><div><b>'+x.game+'</b><div class="muted small">'+x.result+'</div></div><b>'+x.win.toLocaleString()+'</b></div>').join('')||'<div class="notice">No games.</div>';wallet.innerHTML=h.wallet.map(x=>'<div class="history-item"><div><b>'+x.type+'</b><div class="muted small">'+x.note+'</div></div><b style="color:'+(x.amount>=0?'#4fe68a':'#ff7180')+'">'+(x.amount>=0?'+':'')+x.amount.toLocaleString()+'</b></div>').join('')||'<div class="notice">No transactions.</div>'}load()</script><nav class="bottom"><a href="/">Home</a><a href="/matches.html">Matches</a><a href="/casino.html">Casino</a><a href="/wallet.html">Wallet</a><a href="/profile.html">Profile</a></nav></body></html>
