<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAHADEV BOOK</title><link rel="stylesheet" href="/styles.css"></head><body><header class="top wrap"><a class="brand" href="/">♛ MAHADEV BOOK ♛</a><nav class="nav"><a href="/">Home</a><a href="/matches.html">Matches</a><a href="/casino.html">Casino</a><a href="/wallet.html">Wallet</a><a href="/profile.html">Profile</a></nav><div class="bal">🪙 <span id="bal">0</span></div></header><main class="wrap" style="max-width:700px"><div class="card"><h1>Withdraw Coins</h1><p class="muted">Create a coin withdrawal request. No cash settlement is included.</p><form id="f" class="form"><label>Coin Amount<input id="amount" type="number" value="1000" min="100"></label><label>Account / Reference<input id="details" placeholder="Optional details"></label><button class="btn blue">SUBMIT REQUEST</button><div id="msg"></div></form></div></main><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/request",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({kind:"withdraw",amount:Number(amount.value),details:details.value})});let x=await r.json();msg.className=r.ok?"success":"error";msg.textContent=r.ok?"Request submitted.":" "+x.error;if(r.ok)location.href="/wallet.html"}</script></body></html>
