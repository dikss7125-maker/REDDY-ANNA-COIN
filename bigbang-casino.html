<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070709"><title>Casino Game</title><style>html,body{margin:0;background:#070709;color:#fff;font-family:Inter,system-ui,Arial,sans-serif;min-height:100%;overflow:hidden}.top{height:62px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#0b0b0f;border-bottom:1px solid #292b34;box-sizing:border-box}.back{color:#fff;text-decoration:none;font-weight:900;padding:9px 12px;border:1px solid #30323a;border-radius:10px;background:#17181d}.title{font-weight:900;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.coin{color:#ffe07b;font-weight:900}.frame{height:calc(100vh - 62px);width:100%;border:0;background:#08090c;display:block}.loading{position:fixed;inset:62px 0 0;display:grid;place-items:center;background:#08090c;z-index:2}.box{padding:22px;text-align:center;color:#aaa}.spinner{width:36px;height:36px;border:3px solid #3a3a40;border-top-color:#f6c343;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}@keyframes spin{to{transform:rotate(360deg)}}.err{color:#ff8994}</style></head><body><header class="top"><a class="back" href="/casino.html">← Casino</a><div id="title" class="title">Loading game…</div><div class="coin">🪙 <span id="balance">0</span></div></header><div id="loading" class="loading"><div class="box"><div class="spinner"></div><b>Launching game…</b><div style="margin-top:7px;font-size:12px">Using your account wallet</div></div></div><iframe id="game" class="frame" allow="autoplay; fullscreen" allowfullscreen style="display:none"></iframe><script>
const qs=new URLSearchParams(location.search),gameId=qs.get('game');
function showError(msg){document.getElementById('loading').innerHTML='<div class="box err">'+String(msg||'Game launch failed.')+'</div>'}
async function load(){if(!gameId)return showError('Game ID is missing.');try{const m=await fetch('/api/me',{credentials:'same-origin',cache:'no-store'});const me=await m.json();if(!me.loggedIn)return location.href='/login.html';document.getElementById('balance').textContent=Number(me.user.balance||0).toLocaleString();const r=await fetch('/api/bigbang/launch',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({game_id:gameId})});const x=await r.json();if(!r.ok)throw new Error(x.error||'Game launch failed.');document.getElementById('title').textContent=x.game_id||'Casino Game';const f=document.getElementById('game');f.src=x.launch_url;f.onload=()=>document.getElementById('loading').style.display='none';f.style.display='block';setInterval(async()=>{try{const q=await fetch('/api/me',{credentials:'same-origin',cache:'no-store'});const z=await q.json();if(z.loggedIn)document.getElementById('balance').textContent=Number(z.user.balance||0).toLocaleString()}catch{}},5000)}catch(e){showError(e.message)}}load();
</script></body></html>
