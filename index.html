<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REDDY COIN • Login</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#1d2938,#07101a 55%,#05090e);color:#fff;min-height:100vh;display:grid;place-items:center;padding:22px}.w{width:min(430px,100%)}.brand{text-align:center;font-size:32px;font-weight:900;letter-spacing:4px;margin-bottom:25px}.tag{text-align:center;color:#9aacbd;margin:-15px 0 22px}.c{background:#101a26ee;border:1px solid #ffffff16;border-radius:28px;padding:28px;box-shadow:0 22px 70px #0008}h1{margin:0 0 8px}.muted{color:#91a4b6}label{display:block;margin:16px 0 7px;color:#aebdca;font-size:13px}input{width:100%;padding:15px;border-radius:15px;border:1px solid #304153;background:#0b141e;color:#fff;font-size:16px}button{width:100%;padding:15px;margin-top:18px;border:0;border-radius:15px;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;font-weight:800;font-size:16px}.msg{min-height:22px;margin-top:14px;color:#ff9b9b}.small{text-align:center;margin-top:18px;color:#91a4b6}a{color:#8bdcff}</style></head><body><main class="w"><div class="brand">REDDY COIN 🪙</div><div class="tag">Secure member login</div><section class="c"><h1>Welcome back</h1><p class="muted">Login to open your coin dashboard.</p><form id="f"><label>Member ID</label><input id="id" required><label>Password</label><input id="pw" type="password" required><button>LOGIN →</button></form><div id="m" class="msg"></div><div class="small">New user? <a href="/register">Create ID</a></div></section></main>
<script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:id.value,password:pw.value})}),d=await r.json();if(!r.ok)return m.textContent=d.error;localStorage.reddyUser=d.id;location="/home"}</script></body></html>
