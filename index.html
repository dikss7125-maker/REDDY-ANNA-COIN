<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REDDY COIN</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#05090f;color:#fff;font-family:Arial,sans-serif;min-height:100vh;background-image:radial-gradient(circle at 8% 4%,#82002155,transparent 25%),radial-gradient(circle at 96% 88%,#82002144,transparent 30%)}.wrap{width:min(470px,100%);margin:auto;padding:22px 15px}.brand{text-align:center;font-size:34px;font-weight:900;letter-spacing:4px;margin:5px 0 5px}.tag{text-align:center;color:#d4d8dd;letter-spacing:2px;margin-bottom:20px}.card{background:#0b121bf5;border:1px solid #ff243e99;border-radius:26px;padding:23px;box-shadow:0 20px 70px #000a}.title{text-align:center;font-size:25px;font-weight:900}.sub{text-align:center;color:#a5b2bf;margin:8px 0 20px}label{display:block;color:#9eacba;font-size:13px;margin:13px 0 7px}input{width:100%;padding:16px;border:1px solid #354353;border-radius:14px;background:#080f17;color:#fff;font-size:16px}button{width:100%;border:0;border-radius:14px;padding:16px;margin-top:18px;background:linear-gradient(90deg,#ff111a,#ff4215);color:#fff;font-weight:900;font-size:17px;box-shadow:0 8px 25px #ff000044}.create{text-align:center;margin-top:18px;color:#8998a7}.create a{color:#ffd32d;font-weight:900}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}.f{border:1px solid #ffffff13;border-radius:14px;padding:12px 6px;text-align:center;font-size:12px;color:#dce2e8}.f b{display:block;font-size:15px;margin-bottom:4px;color:#fff}.msg{min-height:22px;text-align:center;color:#ff8c8c;font-weight:700;margin-top:10px}.foot{text-align:center;color:#667381;font-size:12px;margin-top:15px}</style></head>
<body><main class="wrap"><div class="brand">REDDY COIN</div><div class="tag" id="welcome">WELCOME BACK</div><section class="card"><div class="title">Login to Your Account</div><div class="sub">Access your account and claim your coins</div><form id="loginForm"><label>Member ID</label><input id="username" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button>LOGIN →</button></form><div id="msg" class="msg"></div><div class="create">New User? <a href="/register">Create ID</a></div><div class="features"><div class="f"><b>Bonus</b>Claim & Earn</div><div class="f"><b>Secure</b>Member Area</div><div class="f"><b>Offers</b>Latest Updates</div></div></section><div class="foot">REDDY COIN</div></main>
<script>
const $=id=>document.getElementById(id);
fetch("/api/public").then(r=>r.json()).then(d=>{$("welcome").textContent=(d.settings.welcomeText||"WELCOME BACK").toUpperCase()});
$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();$("msg").textContent="";
  const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("username").value,password:$("password").value})});
  const d=await r.json();
  if(!r.ok){$("msg").textContent=d.error;return}
  localStorage.setItem("reddy_player_token",d.token); location.href="/home";
});
</script></body></html>
