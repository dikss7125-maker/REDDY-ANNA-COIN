<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REDDY COIN | Login</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at 20% 0,#2a0a0d,#090b11 45%,#050608);color:#fff;min-height:100vh;display:grid;place-items:center;padding:20px}.wrap{width:min(430px,100%)}.brand{text-align:center;font-size:33px;font-weight:900;letter-spacing:3px;color:#fff;text-shadow:0 0 25px #f00;margin-bottom:8px}.coin{text-align:center;font-size:44px;margin-bottom:6px}.tag{text-align:center;color:#c6a1a1;margin-bottom:22px}.card{background:#11151eee;border:1px solid #f0444438;border-radius:24px;padding:25px;box-shadow:0 25px 80px #0009}h1{margin:0 0 8px;font-size:27px}p{color:#9da8b5}label{display:block;color:#c9d0d7;font-size:13px;margin:16px 0 7px}input{width:100%;padding:15px;border-radius:13px;border:1px solid #313b48;background:#0a0d12;color:#fff;font-size:16px}.btn{width:100%;padding:15px;border:0;border-radius:13px;background:linear-gradient(90deg,#df1d2d,#ff4c37);color:#fff;font-size:16px;font-weight:900;margin-top:18px}.msg{min-height:22px;color:#ff9c9c;margin-top:12px}.small{text-align:center;color:#98a4b1;margin-top:18px}.small a{color:#ff6a62}</style></head><body><main class=wrap><div class=coin>🪙</div><div class=brand id=name>REDDY COIN</div><div class=tag>Secure Member Login</div><section class=card><h1>Login to your account</h1><p>Access your coin dashboard and bonus claims.</p><form id=f><label>Member ID</label><input id=id required><label>Password</label><input id=pw type=password required><button class=btn>LOGIN</button></form><div id=m class=msg></div><div class=small>New member? <a href="/register">Create ID</a></div></section></main><script>
async function s(){const r=await fetch("/api/public");const d=await r.json();name.textContent=d.settings.siteName}s();f.onsubmit=async e=>{e.preventDefault();const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:id.value,password:pw.value})});const d=await r.json();if(!r.ok){m.textContent=d.error;return}location="/home"}</script></body></html>
