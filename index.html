<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAHADEV BOOK</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17202a;font-family:Arial,sans-serif}.wrap{max-width:520px;margin:auto;padding:20px}.brand{text-align:center;font-size:31px;font-weight:900;letter-spacing:2px;margin:10px 0 20px}.logo{width:76px;height:76px;object-fit:cover;border-radius:20px;margin:auto;display:block;background:#202b36}.card{background:#fff;padding:20px;border-radius:17px;margin:15px 0;box-shadow:0 4px 18px #0001}.offer{width:100%;max-height:290px;object-fit:cover;border-radius:12px;display:none}input,button{width:100%;padding:14px;margin:7px 0;border-radius:10px;font-size:16px}input{border:1px solid #ccd3da}button{border:0;background:#202b36;color:#fff;font-weight:700}.support button{background:#fff;color:#202b36;border:1px solid #d7dce1}.success{color:#167a38;font-weight:700}.error{color:#c62828;font-weight:700}.balance{text-align:center;font-size:28px;font-weight:800}</style></head>
<body><div class="wrap"><div class="brand"><img id="logo" class="logo" style="display:none"><div id="name">MAHADEV BOOK</div></div>
<div class="card"><a href="/matches.html" style="display:block;text-decoration:none;text-align:center;background:linear-gradient(90deg,#16a34a,#22c55e);color:#06110a;padding:14px;border-radius:12px;font-weight:900;margin-bottom:14px">🏏 LIVE MATCHES</a><img id="offer" class="offer"><h2>Claim Bonus</h2><input id="player" placeholder="Player ID"><input id="code" placeholder="Bonus Code"><button onclick="claim()">CLAIM BONUS</button><p id="msg"></p><div class="balance" id="balance">0 Coins</div></div>
<div class="card support"><h3>Customer Care</h3><button id="wa" style="display:none">WhatsApp Support</button><button id="tg" style="display:none">Telegram Support</button><button id="web" style="display:none">Visit Website</button></div></div>
<script>
async function load(){let s=await fetch('/api/settings').then(r=>r.json());name.textContent=s.siteName||'MAHADEV BOOK';if(s.logo){logo.src=s.logo;logo.style.display='block'}if(s.offer){offer.src=s.offer;offer.style.display='block'}[['wa',s.whatsapp],['tg',s.telegram],['web',s.website]].forEach(([id,url])=>{if(url){let e=document.getElementById(id);e.style.display='block';e.onclick=()=>location.href=url}})}
async function claim(){msg.className='error';let r=await fetch('/api/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({player:player.value,code:code.value})});let x=await r.json();if(!r.ok){msg.textContent=x.error;return}msg.className='success';msg.textContent=x.value.toLocaleString()+' Coins Added Successfully.';code.value=''}
load();
</script></body></html>
