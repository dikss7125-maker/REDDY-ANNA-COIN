<script>
const id=new URLSearchParams(location.search).get('id')||'',qs=new URLSearchParams(location.search);let match={id,series:'Live Cricket',home:'Home',away:'Away',hs:'—',as:'—',target:'',venue:'',status:'LIVE',raw:{}},odds={home:{},away:{}},selected={market:qs.get('market')||'',odds:Number(qs.get('odds')||0)},oddsUpdatedAt=0;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function scoreText(x){return x?`${x.r??'—'}/${x.w??'—'}${x.o!=null?` (${x.o})`:''}`:'—'}

function draw(){const o=odds||{}, stakeValue=Math.max(10,Number(stake.value)||10),possible=selected.odds?Math.floor(stakeValue*selected.odds):0,profit=selected.odds?Math.max(0,possible-stakeValue):0;hero.innerHTML=`<div class="matchTop"><div class="matchTopInner"><div><div class="teamBig">${esc(match.home)}</div><div class="teamScore">${esc(match.hs||'—')}</div><div class="scoreHint">Current score</div></div><div><span class="badge live">LIVE</span><div class="vs" style="margin-top:7px">VS</div><div class="muted small">Target ${esc(match.target||'—')}</div></div><div><div class="teamBig">${esc(match.away)}</div><div class="teamScore">${esc(match.as||'—')}</div><div class="scoreHint">Current score</div></div></div></div><div class="tabs" style="margin:13px 0"><button class="active">Match Odds</button></div><div class="marketSectionTitle"><span><i class="odds-live-dot"></i>BACK / LAY</span><span>${oddsUpdatedAt?`Updated ${new Date(oddsUpdatedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})}`:'Live exchange prices'}</span></div><div class="marketGrid">${priceButton(match.home,o.home?.back,'BACK','blue')}${priceButton(match.home,o.home?.lay,'LAY','red')}${priceButton(match.away,o.away?.back,'BACK','blue')}${priceButton(match.away,o.away?.lay,'LAY','red')}</div><div class="marketSectionTitle">WHO WILL WIN <span>Tap a price to select</span></div><div class="marketGrid">${priceButton(match.home,o.home?.back,'WIN','green')}${priceButton(match.away,o.away?.back,'WIN','green')}</div>`;slip.innerHTML=selected.odds?`<div class="betLine"><div class="toprow"><b>${esc(selected.market)}</b><b style="color:var(--gold2)">${selected.odds.toFixed(2)}</b></div><div class="betHint">Selected price • place your coin stake below</div></div><div class="betLine"><div class="toprow"><span>Possible Return</span><b id="possible">${possible.toLocaleString()}</b></div><div class="toprow" style="margin-top:6px"><span>Profit <small>(+)</small></span><b id="profit" class="profitPlus">+${profit.toLocaleString()}</b></div>`:'<div class="notice">Tap a Back, Lay or Win price. Your selected odds and profit will appear here.</div>';info.innerHTML=`<div class="kv"><span>Series</span><b>${esc(match.series)}</b></div><div class="kv"><span>Venue</span><b>${esc(match.venue||'—')}</b></div><div class="kv"><span>Format</span><b>${esc(match.raw.matchType||'Cricket')}</b></div><div class="kv"><span>Status</span><b style="color:var(--green)">${esc(match.status||'LIVE')}</b></div>`}
stake.oninput=()=>{if(!selected.odds)return;const n=Math.max(10,Number(stake.value)||10),p=Math.floor(n*selected.odds),profit=Math.max(0,p-n);const a=document.getElementById('possible'),b=document.getElementById('profit');if(a)a.textContent=p.toLocaleString();if(b)b.textContent='+'+profit.toLocaleString()}
function renderMyBets(bets){if(!myBets)return;if(!bets?.length){myBets.innerHTML='';return}myBets.innerHTML=`<div class="marketSectionTitle" style="margin-top:12px">YOUR BETS ON THIS MATCH <span>${bets.length} placed</span></div>`+bets.slice(0,5).map(b=>`<div class="myBetCard"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(b.market)}</b><b>${Number(b.odds).toFixed(2)}x</b></div><div class="myBetMeta">Stake ${Number(b.stake).toLocaleString()} coins • Possible +${Number(b.profit||0).toLocaleString()} profit • ${new Date(b.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})}</div><div class="myBetMeta">Status: ${esc(b.status||'OPEN')}</div></div>`).join('')}
async function loadMyBets(){try{const r=await fetch('/api/match-bets/'+encodeURIComponent(id),{cache:'no-store'}),x=await r.json().catch(()=>({}));if(r.ok)renderMyBets(x.bets||[])}catch{}}
async function place(){if(!selected.odds){msg.className='error';msg.textContent='First select a Back/Lay price.';return}msg.className='';msg.textContent='Placing…';const r=await fetch('/api/match-bet',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stake:Number(stake.value),market:selected.market,odds:selected.odds,matchId:match.id,home:match.home,away:match.away})}),x=await r.json().catch(()=>({}));if(!r.ok){msg.className='error';msg.textContent=x.error||'Unable to place pick.';return}bal.textContent=Number(x.balance).toLocaleString();msg.className='success';msg.textContent='Bet placed successfully on this match.';await loadMyBets();draw()}
async function loadOdds(){try{const r=await fetch('/api/match-odds/'+encodeURIComponent(id),{cache:'no-store'}),x=await r.json().catch(()=>({}));if(r.ok&&x.prices){odds=x.prices;oddsUpdatedAt=Number(x.cachedAt)||Date.now();draw()} }catch{}}
async function loadLive(){try{const r=await fetch('/api/live-match/'+encodeURIComponent(id),{cache:'no-store'}),x=await r.json();if(r.ok&&x.match){match=parseMatch(x.match);feed.textContent=match.status||'LIVE';draw()}}catch{}}
async function init(){const me=await fetch('/api/me',{cache:'no-store'}).then(r=>r.json()).catch(()=>({loggedIn:false}));if(!me.loggedIn)return location.href='/login.html';bal.textContent=Number(me.user.balance||0).toLocaleString();if(!id){err.innerHTML='<div class="error">Match ID is missing.</div>';return}await loadLive();await loadOdds();await loadMyBets()}
init();setInterval(loadLive,20000);setInterval(loadOdds,5000);setInterval(loadMyBets,10000)
</script></body></html>
