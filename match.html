<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAHADEV BOOK</title><link rel="stylesheet" href="/styles.css"></head><body><header class="top wrap"><a class="brand" href="/">♛ MAHADEV BOOK ♛</a><nav class="nav"><a href="/">Home</a><a href="/matches.html">Matches</a><a href="/casino.html">Casino</a><a href="/wallet.html">Wallet</a><a href="/profile.html">Profile</a></nav><div class="bal">🪙 <span id="bal">0</span></div></header><main class="wrap"><div id="error"></div><div id="main"></div></main><nav class="bottom"><a href="/">Home</a><a href="/matches.html">Matches</a><a href="/casino.html">Casino</a><a href="/wallet.html">Wallet</a><a href="/profile.html">Profile</a></nav><script>const mid=new URLSearchParams(location.search).get("id");async function load(){let m=await fetch("/api/me").then(r=>r.json());if(!m.loggedIn){location.href="/login.html";return}bal.textContent=Number(m.user.balance).toLocaleString();let r=await fetch("/api/live-match/"+encodeURIComponent(mid||"sample-ipl"));let x=await r.json();let a=x.match;let h=a.home||a.localteam||a.teams?.home?.name||"MI",aw=a.away||a.visitorteam||a.teams?.away?.name||"CSK",hs=a.homeScore||a.localteam_score||a.score?.home||a.score?.summary||"189/4 (18.2)",as=a.awayScore||a.visitorteam_score||a.score?.away||"Target 196";main.innerHTML=`<div class="grid2"><section class="card"><div class="match-top"><b>${a.series||"Indian Premier League"}</b><span class="badge">LIVE</span></div><div class="teams"><div><div class="team">${h}</div><div class="score">${hs}</div></div><div class="vs">VS</div><div><div class="team">${aw}</div><div class="score">${as}</div></div></div><div class="tabs"><button class="on">All Markets</button><button>Fancy</button><button>Session</button><button>Stats</button></div><div class="market-grid"><div class="market"><b>${h}</b><span class="odds blue-t">1.85</span></div><div class="market"><b>${aw}</b><span class="odds red-t">1.95</span></div><div class="market"><b>Top Batsman</b><span class="odds green-t">2.10</span></div><div class="market"><b>Over 6.5</b><span class="odds blue-t">1.80</span></div><div class="market"><b>Under 6.5</b><span class="odds red-t">2.00</span></div><div class="market"><b>Yes / No</b><span class="odds">1.90</span></div></div></section><aside style="display:grid;gap:12px"><div class="card"><h3>Match Info</h3><div class="row"><span>Venue</span><b>${a.venue?.name||a.venue||"—"}</b></div><div class="row"><span>Status</span><b>LIVE</b></div><div class="row"><span>Format</span><b>${a.format||a.type||"Cricket"}</b></div></div><div class="card"><h3>Coin Pick</h3><div class="form"><label>Stake<input id="stake" type="number" value="100"></label><button class="btn gold" onclick="place()">PLACE PICK</button><div id="pmsg"></div></div></div></aside></div>`}async function place(){let r=await fetch("/api/game/play",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({game:"coinflip",stake:Number(stake.value)})});let x=await r.json();pmsg.className=r.ok?"success":"error";pmsg.textContent=r.ok?"Coin pick processed: "+x.entry.result:" "+x.error}load();</script></body></html>
