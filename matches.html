<header class="topbar"><div class="container topin"><button class="hamb">☰</button><a class="brand" href="/">♛ MAHADEV BOOK ♛<small>LIVE MATCH CENTRE</small></a><nav class="nav"><a href="/">Home</a><a class="active" href="/matches.html">Matches</a><a href="/casino.html">Casino</a><a href="/wallet.html">Wallet</a><a href="/profile.html">Profile</a></nav><div class="spacer"></div><div class="coin">🪙 <b id="bal">0</b></div><div class="avatar">P</div></div></header>
<main class="container"><div class="sectionHead" style="margin-top:4px"><div><h2 style="font-size:26px">Live Matches <span class="badge live">LIVE</span></h2><div class="muted">Live score and market dashboard</div></div><button class="btn ghost" onclick="load()">↻ Refresh</button></div>
<div id="err"></div>

<section class="mainMatch"><div id="hero" class="card"><div class="notice">Loading match centre…</div></div></section>
<aside class="sideRail"><div class="card"><div class="sectionTitle">Match Info</div><div id="info" style="margin-top:8px" class="muted">Choose a match.</div></div><div class="card"><div class="sectionTitle">Recent Overs</div><div class="recentRuns" style="margin-top:10px"><span class="good">1</span><span class="good">4</span><span class="r">W</span><span>0</span><span>2</span><span class="good">6</span><span class="r">W</span></div></div><div class="card"><div class="sectionTitle">Scoreboard</div><div class="kv"><span>Runs</span><b id="sideRuns">—</b></div><div class="kv"><span>Overs</span><b>18.2</b></div><div class="kv"><span>Target</span><b id="sideTarget">—</b></div><div class="kv"><span>RRR</span><b>4.20</b></div></div></aside></section></main>
<nav class="bottom"><a href="/">⌂<br>Home</a><a class="active" href="/matches.html">◩<br>Matches</a><a href="/casino.html">◉<br>Casino</a><a href="/wallet.html">▣<br>Wallet</a><a href="/profile.html">◯<br>Profile</a></nav>
<script>
const fallback=[{id:'m1',series:'Indian Premier League',home:'MI',away:'CSK',hs:'189/4',as:'',target:'196',venue:'Wankhede Stadium',status:'LIVE'},{id:'m2',series:'International ODI',home:'ENG',away:'AUS',hs:'220/6',as:'',target:'281',venue:'London',status:'LIVE'},{id:'m3',series:'T20 International',home:'PAK',away:'NZ',hs:'128/3',as:'',target:'176',venue:'Lahore',status:'LIVE'},{id:'m4',series:'ODI',home:'BAN',away:'SL',hs:'310/5',as:'',target:'—',venue:'Dhaka',status:'LIVE'}];let matches=fallback,selected=0;
function normalize(a){return a.map((m,i)=>({id:m.match_id??m.id??i,series:m.series?.name??m.series??m.format??'Cricket',home:m.localteam?.name??m.localteam??m.teams?.home?.name??'Home',away:m.visitorteam?.name??m.visitorteam??m.teams?.away?.name??'Away',hs:m.localteam_score??m.score?.home??m.score?.summary??'',as:m.visitorteam_score??m.score?.away??'',target:m.target??m.score?.target??'',venue:m.venue?.name??m.venue??'',status:'LIVE'}))}
async function load(){const me=await fetch('/api/me').then(r=>r.json());if(!me.loggedIn)return location.href='/login.html';bal.textContent=(me.user.balance||0).toLocaleString();try{const r=await fetch('/api/live-matches');const x=await r.json();if(r.ok&&Array.isArray(x.matches)&&x.matches.length)matches=normalize(x.matches);else err.innerHTML='<div class="notice">Live feed unavailable. Showing the match-centre layout with fallback fixtures.</div>'}catch{err.innerHTML='<div class="notice">Live feed temporarily unavailable. Showing the match-centre layout with fallback fixtures.</div>'}render()}
function render(){list.innerHTML=matches.map((m,i)=>`<a class="miniMatch ${i===selected?'active':''}" href="/match.html?id=${encodeURIComponent(m.id)}"><div class="match-header"><span class="small">${m.series}</span><span class="badge live">LIVE</span></div><div class="teams"><span class="team">${m.home}</span><span class="vs">VS</span><span class="team">${m.away}</span></div><div class="muted small">${m.hs||'—'}${m.target?' • Target '+m.target:''}</div></a>`).join('');const m=matches[selected];sideRuns.textContent=m.hs||'—';sideTarget.textContent=m.target||'—';hero.innerHTML=`<div class="matchTop"><div class="matchTopInner"><div><div class="teamBig">${m.home}</div><div class="teamScore">${m.hs||'—'}</div><div class="scoreHint">Current score</div></div><div><span class="badge live">LIVE</span><div class="vs" style="margin-top:8px">VS</div></div><div><div class="teamBig">${m.away}</div><div class="teamScore">${m.as||'—'}</div><div class="scoreHint">Target ${m.target||'—'}</div></div></div></div><div class="tabs" style="margin:12px 0"><button class="active">All Markets</button><button>Main Market</button><button>Fancy</button><button>Session</button><button>Player</button><button>Over</button><button>Stats</button></div><div class="sectionTitle">Match Winner</div><div class="marketGrid" style="margin-top:8px"><div class="market"><strong>${m.home}</strong><b class="odds blue">1.85</b></div><div class="market"><strong>${m.away}</strong><b class="odds red">1.95</b></div></div><div class="sectionTitle" style="margin-top:14px">Top Batter (Match)</div><div class="marketGrid" style="margin-top:8px"><div class="market"><strong>Rohit Sharma</strong><b class="odds blue">2.10</b></div><div class="market"><strong>S. Yadav</strong><b class="odds green">1.85</b></div><div class="market"><strong>R. Gaikwad</strong><b class="odds red">1.70</b></div><div class="market"><strong>D. Conway</strong><b class="odds">2.50</b></div></div><div class="sectionTitle" style="margin-top:14px">Over 19.3 — Runs</div><div class="marketGrid" style="margin-top:8px"><div class="market"><strong>Over 7.5</strong><b class="odds blue">1.80</b></div><div class="market"><strong>Under 7.5</strong><b class="odds red">2.00</b></div></div><div class="sectionTitle" style="margin-top:14px">Yes / No Market</div><div class="marketGrid" style="margin-top:8px"><div class="market"><strong>${m.home} will win</strong><b class="odds green">1.90</b></div><div class="market"><strong>${m.away} will win</strong><b class="odds red">1.90</b></div></div><div class="notice" style="margin-top:12px">Select a market to open the detailed match view.</div>`;info.innerHTML=`<div class="kv"><span>Series</span><b>${m.series}</b></div><div class="kv"><span>Venue</span><b>${m.venue||'—'}</b></div><div class="kv"><span>Format</span><b>Cricket</b></div><div class="kv"><span>Status</span><b style="color:var(--green)">LIVE</b></div>`}
load();setInterval(load,25000)
</script></body></html>
