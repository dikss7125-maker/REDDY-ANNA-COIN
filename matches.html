<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAHADEV BOOK</title><link rel="stylesheet" href="/styles.css"></head><body><header class="top wrap"><a class="brand" href="/">♛ MAHADEV BOOK ♛</a><nav class="nav"><a href="/">Home</a><a href="/matches.html">Matches</a><a href="/casino.html">Casino</a><a href="/wallet.html">Wallet</a><a href="/profile.html">Profile</a></nav><div class="bal">🪙 <span id="bal">0</span></div></header><main class="wrap"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><h1 style="margin:0">Live Matches <span class="badge">LIVE</span></h1><p class="muted">Cricket live data when the API is connected.</p></div><button class="btn ghost" onclick="load()">Refresh</button></div><div id="msg" style="margin-top:12px"></div><div id="list" style="margin-top:14px"></div></main><nav class="bottom"><a href="/">Home</a><a href="/matches.html">Matches</a><a href="/casino.html">Casino</a><a href="/wallet.html">Wallet</a><a href="/profile.html">Profile</a></nav><script>async function load(){let me=await fetch("/api/me").then(r=>r.json());if(!me.loggedIn){location.href="/login.html";return}bal.textContent=Number(me.user.balance).toLocaleString();let r=await fetch("/api/live-matches");let x=await r.json();if(!x.ok){msg.className="error";msg.textContent=x.error;return}msg.className=x.live?"success":"notice";msg.textContent=x.live?"Live data connected.":"Live provider unavailable; showing match layout safely.";list.innerHTML=(x.matches||[]).map((m,i)=>`<a class="card match" href="/match.html?id=${encodeURIComponent(m.id)}"><div class="match-top"><span>${m.series}</span><span class="badge">${m.status||"LIVE"}</span></div><div class="teams"><div><div class="team">${m.home}</div><div class="score">${m.homeScore||"—"}</div></div><div class="vs">VS</div><div><div class="team">${m.away}</div><div class="score">${m.awayScore||"—"}</div></div></div><div class="muted small">${m.venue||""}</div></a>`).join("")}load();setInterval(load,20000);</script></body></html>
