<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAHADEV BOOK</title><link rel="stylesheet" href="/styles.css"></head><body><header class="top wrap"><a class="brand" href="/">♛ MAHADEV BOOK ♛</a><nav class="nav"><a href="/">Home</a><a href="/matches.html">Matches</a><a href="/casino.html">Casino</a><a href="/wallet.html">Wallet</a><a href="/profile.html">Profile</a></nav><div class="bal">🪙 <span id="bal">0</span></div></header><main class="wrap"><div class="grid2"><section class="card"><h1>Wallet</h1><div class="stat"><div class="muted">Balance</div><b id="balance">0</b></div><div style="display:flex;gap:8px;margin-top:12px"><a class="btn green" href="/deposit.html">ADD COINS</a><a class="btn blue" href="/withdraw.html">WITHDRAW</a></div></section><section class="card"><h2>Overview</h2><div id="ov"></div></section></div><section class="card" style="margin-top:14px"><h2>Recent Transactions</h2><div id="hist" class="history"></div></section></main><nav class="bottom"><a href="/">Home</a><a href="/matches.html">Matches</a><a href="/casino.html">Casino</a><a href="/wallet.html">Wallet</a><a href="/profile.html">Profile</a></nav><script>async function load(){let m=await fetch("/api/me").then(r=>r.json());if(!m.loggedIn){location.href="/login.html";return}bal.textContent=Number(m.user.balance).toLocaleString();balance.textContent=Number(m.user.balance).toLocaleString();let h=await fetch("/api/history").then(r=>r.json());ov.innerHTML='<div class="row"><span>Games</span><b>'+h.games.length+'</b></div><div class="row"><span>Bonus Claims</span><b>'+h.claims.length+'</b></div><div class="row"><span>Requests</span><b>'+h.requests.length+'</b></div>';hist.innerHTML=h.wallet.slice(0,20).map(x=>'<div class="history-item"><div><b>'+x.type+'</b><div class="muted small">'+x.note+'</div></div><b style="color:'+(x.amount>=0?'#4fe68a':'#ff7180')+'">'+(x.amount>=0?'+':'')+x.amount.toLocaleString()+'</b></div>').joi
