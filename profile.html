<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAHADEV BOOK</title><link rel="stylesheet" href="/styles.css"></head><body><header class="top wrap"><a class="brand" href="/">♛ MAHADEV BOOK ♛</a><nav class="nav"><a href="/">Home</a><a href="/matches.html">Matches</a><a href="/casino.html">Casino</a><a href="/wallet.html">Wallet</a><a href="/profile.html">Profile</a></nav><div class="bal">🪙 <span id="bal">0</span></div></header><main class="wrap" style="max-width:700px"><div class="card"><h1 id="title">Profile</h1><div id="info"></div><button class="btn red" onclick="logout()">LOGOUT</button></div></main><script>async function load(){let m=await fetch("/api/me").then(r=>r.json());if(!m.loggedIn){location.href="/login.html";return}title.textContent=m.user.id;info.innerHTML='<div class="row"><span>Player ID</span><b>'+m.user.id+'</b></div><div class="row"><span>Balance</span><b>'+Number(m.user.balance).toLocaleString()+'</b></div><div class="row"><span>Joined</span><b>'+new Date(m.user.created).toLocaleDateString()+'</b></div>'}async function logout(){await fetch("/api/logout",{method:"POST"});location.href="/login.html"}load()</script><nav class="bottom"><a href="/">Home</a><a href="/matches.html">Matches</a><a href="/casino.html">Casino</a><a href="/wallet.html">Wallet</a><a href="/profile.html">Profile</a></nav></body></html>
