<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAHADEV BOOK</title><link rel="stylesheet" href="/styles.css"></head><body><header class="top wrap"><a class="brand" href="/">♛ MAHADEV BOOK ♛</a><nav class="nav"><a href="/">Home</a><a href="/matches.html">Matches</a><a href="/casino.html">Casino</a><a href="/wallet.html">Wallet</a><a href="/profile.html">Profile</a></nav><div class="bal">🪙 <span id="bal">0</span></div></header><main class="wrap"><div class="card"><div class="match-top"><h1 style="margin:0">✈️ AVIATOR</h1><span class="pill">FAIR / SERVER RANDOM</span></div><div class="stat" style="margin-top:12px;text-align:center"><div class="muted">CURRENT MULTIPLIER</div><b id="multi" style="font-size:54px">1.00x</b></div><div style="height:210px;margin:14px 0;border-radius:15px;background:radial-gradient(circle at 60% 20%,#1b2940,#081018);position:relative;overflow:hidden"><div id="pl" style="position:absolute;left:10%;bottom:22%;font-size:62px;transition:all .5s">✈️</div><div style="position:absolute;left:0;right:0;bottom:24%;height:3px;background:linear-gradient(90deg,#f33,#f7c83e,#26cf69);transform:rotate(-10deg);transform-origin:left"></div></div><div class="grid2"><div class="form"><label>Coin Amount<input id="stake" type="number" value="100" min="10"></label><button class="btn red" onclick="play()">PLAY ROUND</button></div><div class="card"><div class="muted">Result</div><h2 id="out">—</h2></div></div><div id="msg" style="margin-top:12px"></div></div></main><nav class="bottom"><a href="/">Home</a><a href="/matches.html">Matches</a><a href="/casino.html">Casino</a><a href="/wallet.html">Wallet</a><a href="/profile.html">Profile</a></nav><script>async function init(){let m=await fetch("/api/me").then(r=>r.json());if(!m.loggedIn)location.href="/login.html";else bal.textContent=Number(m.user.balance).toLocaleString()}async function play(){let r=await fetch("/api/game/play",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({game:"aviator",stake:Number(stake.value)})});let x=await r.json();if(!r.ok){msg.className="error";msg.textContent=x.error;return}multi.textContent=x.entry.result;out.textContent=x.entry.win?`Win ${x.entry.win} coins`:"No win this round";bal.textContent=Number(x.balance).toLocaleString();pl.style.left=(10+Math.min(78,x.entry.multiplier*4))+"%";msg.className=x.entry.win?"success":"notice";msg.textContent=x.entry.win?"Round complete.":"Round complete."}init()</script></body></html>
